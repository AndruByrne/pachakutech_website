<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pachakutech">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pachakutech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pachakutech</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function() {
      // Get the part of the URL after the #
      var fragment = window.location.hash;

      // Check if it's the specific fragment we want to redirect
      if (fragment === '#/car_crush_privacy_policy') {
        var newPath = '/car_crush_privacy_policy';
        // Replace the current history state with the new path.
        // This changes the URL in the browser bar without adding a new history entry
        // and without causing a page reload.
        // The Flutter app (with setPathUrlStrategy) should then pick up this newPath.
        console.log('index.html: Detected fragment ' + fragment + ', rewriting to ' + newPath);
        window.history.replaceState(null, '', newPath);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
